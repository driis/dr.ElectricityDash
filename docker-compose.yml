# Local dependencies only. The app itself runs on the host (dotnet run / IDE) so it is easy to debug.
# These credentials are for a throwaway local database and are not secrets.
services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: electricitydash
      POSTGRES_PASSWORD: electricitydash
      POSTGRES_DB: electricitydash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electricitydash"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
